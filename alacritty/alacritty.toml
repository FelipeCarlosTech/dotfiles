[cursor]
style = "Block"
unfocused_hollow = true

[font]
size = 18

[font.normal]
family = "Google Sans Code NF"

[window]
option_as_alt = "Both"
dimensions = { columns = 150, lines = 30 }
startup_mode = "Windowed"
opacity = 1
padding.x = 10
padding.y = 5
decorations = "none"

[env]
TERM = "xterm-256color"

[terminal]
shell = "/bin/bash"
