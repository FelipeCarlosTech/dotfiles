# Ayu Dark Alacritty Colors
## name: ayu-dark
## upstream: https://github.com/alacritty/alacritty-theme

[colors.primary]
background = "#0A0E14"
foreground = "#B3B1AD"

[colors.cursor]
text = "#0A0E14"
cursor = "#B3B1AD"

[colors.vi_mode_cursor]
text = "#0A0E14"
cursor = "#53BDFA"

[colors.search.matches]
foreground = "#B3B1AD"
background = "#3E4451"

[colors.search.focused_match]
foreground = "#0A0E14"
background = "#FFB454"

[colors.footer_bar]
foreground = "#B3B1AD"
background = "#1F2430"

[colors.hints.start]
foreground = "#0A0E14"
background = "#FFB454"

[colors.hints.end]
foreground = "#B3B1AD"
background = "#1F2430"

[colors.selection]
text = "#B3B1AD"
background = "#253340"

[colors.normal]
black = "#01060E"
red = "#EA6C73"
green = "#91B362"
yellow = "#F9AF4F"
blue = "#53BDFA"
magenta = "#FAE994"
cyan = "#90E1C6"
white = "#C7C7C7"

[colors.bright]
black = "#686868"
red = "#F07178"
green = "#C2D94C"
yellow = "#FFB454"
blue = "#59C2FF"
magenta = "#FFEE99"
cyan = "#95E6CB"
white = "#FFFFFF"

