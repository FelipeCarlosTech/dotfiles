"$schema" = "https://starship.rs/config-schema.json"

# Colors are referenced by SEMANTIC palette key only — never by hex.
# Switching themes rewrites the single `palette = "..."` line below, which is
# done by scripts/theme.sh from themes/<name>.sh. Adding a theme means adding a
# matching [palettes.<name>] block here with the same set of keys.

format = """\
($directory)\
$os\
$git_branch\
$fill\
$nodejs\
$rust\
$golang\
$php\
$bun\
$java\
$c\
$conda\
$zig\
$python\
$cmd_duration\
$time\
\n$character\
"""

# Disable the blank line at the beginning of the prompt
add_newline = true

# Command timeout
command_timeout = 3600000

# Active palette — GENERATED LINE, rewritten by scripts/theme.sh
palette = "tokyonight_night"

[fill]
symbol = ' '

# ---------------------------------------------------------------------------
# Palettes — every palette MUST define the same keys.
# ---------------------------------------------------------------------------

[palettes.tokyonight_night]
bg = "#1a1b26"
fg = "#c0caf5"
muted = "#565f89"
red = "#f7768e"
green = "#9ece6a"
yellow = "#e0af68"
blue = "#7aa2f7"
magenta = "#bb9af7"
cyan = "#7dcfff"
accent = "#e0af68"

[palettes.tokyonight_storm]
bg = "#24283b"
fg = "#c0caf5"
muted = "#565f89"
red = "#f7768e"
green = "#9ece6a"
yellow = "#e0af68"
blue = "#7aa2f7"
magenta = "#bb9af7"
cyan = "#7dcfff"
accent = "#e0af68"

[palettes.ayu_dark]
bg = "#0A0E14"
fg = "#B3B1AD"
muted = "#686868"
red = "#F07178"
green = "#C2D94C"
yellow = "#FFB454"
blue = "#59C2FF"
magenta = "#FFEE99"
cyan = "#95E6CB"
accent = "#FFB454"

# ---------------------------------------------------------------------------
# Modules
# ---------------------------------------------------------------------------

[character]
success_symbol = "[ ](fg:blue)"
error_symbol = "[ ](fg:red)"

[username]
style_user = 'bold fg:fg'
style_root = 'bold fg:red'
format = '[  $user](fg:$style) '
disabled = false
show_always = true

[directory]
format = "[$path](bold $style)[$read_only]($read_only_style) "
truncation_length = 2
style = "fg:magenta"
read_only_style = "fg:magenta"
before_repo_root_style = "fg:muted"
truncation_symbol = "…/"
truncate_to_repo = true
read_only = "  "

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[cmd_duration]
format = " took [ $duration]($style) "
style = "bold fg:magenta"
min_time = 500

[git_branch]
format = "󰧂 [$symbol$branch]($style) "
style = "bold fg:yellow"
symbol = " "

[git_status]
format = '[$all_status$ahead_behind ]($style)'
style = "fg:green"

[docker_context]
disabled = true
symbol = " "

[python]
disabled = false
format = '[${symbol}${pyenv_prefix}(${version})( \($virtualenv\))](fg:blue)($style)'
symbol = " "
version_format = "${raw}"

[java]
format = '[[ $symbol ($version) ](fg:red)]($style)'
version_format = "${raw}"
symbol = " "
disabled = false

[c]
format = '[[ $symbol ($version) ](fg:cyan)]($style)'
symbol = " "
version_format = "${raw}"
disabled = false

[zig]
format = '[[ $symbol ($version) ](fg:magenta)]($style)'
version_format = "${raw}"
disabled = false

[bun]
version_format = "${raw}"
format = '[[ $symbol ($version) ](fg:green)]($style)'
disabled = false

[nodejs]
symbol = ""
format = '[[ $symbol ($version) ](fg:green)]($style)'

[rust]
symbol = ""
format = '[[ $symbol ($version) ](fg:red)]($style)'

[golang]
symbol = ""
format = '[[ $symbol ($version) ](fg:cyan)]($style)'

[php]
symbol = ""
format = '[[ $symbol ($version) ](fg:magenta)]($style)'

[time]
disabled = true
time_format = "%R"
format = '[[   $time ](fg:cyan)]($style)'

[os]
disabled = true
style = "fg:fg"

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = " 󰣭 "
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"

[conda]
format = '[[ $symbol ($version) ](fg:cyan)]($style)'
